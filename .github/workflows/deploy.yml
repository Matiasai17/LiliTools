name: Build & Deploy

# Compila `source` con Vite y publica el contenido de dist/ en `main`, que es
# la rama que sirve el hosting (Hostinger vía .htaccess / GitHub Pages bajo
# /LiliTools/). `main` nunca se edita a mano: solo la actualiza este workflow.
on:
  push:
    branches: [source]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist/ to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
          commit_message: >-
            Deploy: ${{ github.event.head_commit.message || github.sha }}
