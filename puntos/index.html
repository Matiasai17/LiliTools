<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Contador de puntos rápido: Mati vs Giuli." />
    <meta name="theme-color" content="#1b1035" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Puntos" />
    <link rel="icon" type="image/svg+xml" href="/LiliTools/favicon.svg" />
    <link rel="apple-touch-icon" href="/LiliTools/favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>Puntos: Mati vs Giuli</title>

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: 'Nunito', system-ui, sans-serif;
        background: #0d0620;
      }

      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        user-select: none;
      }

      .zone {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: filter 0.15s ease;
      }

      .zone:active {
        filter: brightness(1.15);
      }

      .zone--mati {
        background: radial-gradient(circle at 50% 20%, #35d1c5 0%, #0e8f9c 45%, #0a4a6b 100%);
        border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      }

      .zone--giuli {
        background: radial-gradient(circle at 50% 80%, #ff5fa2 0%, #c93bd6 45%, #5c1a8f 100%);
      }

      .name {
        font-weight: 900;
        font-size: clamp(1.3rem, 5vw, 2.2rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
        margin-bottom: 0.2em;
      }

      .score {
        font-weight: 900;
        font-size: clamp(5rem, 28vw, 11rem);
        line-height: 1;
        color: #fff;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        font-variant-numeric: tabular-nums;
      }

      .hint {
        margin-top: 0.6em;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 700;
      }

      .minus {
        position: absolute;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.28);
        color: #fff;
        font-size: 1.5rem;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
        backdrop-filter: blur(4px);
      }

      .zone--mati .minus {
        bottom: 18px;
        left: 18px;
      }

      .zone--giuli .minus {
        top: 18px;
        right: 18px;
      }

      .reset {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(13, 6, 32, 0.55);
        color: #fff;
        font-size: 1.4rem;
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pop {
        position: absolute;
        font-weight: 900;
        font-size: 2rem;
        color: #fff;
        pointer-events: none;
        animation: floatUp 0.6s ease-out forwards;
      }

      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateY(0) scale(0.8);
        }
        100% {
          opacity: 0;
          transform: translateY(-70px) scale(1.3);
        }
      }
    </style>
  </head>
  <body>
    <div class="zone zone--giuli" id="zone-giuli">
      <div class="name">Giuli</div>
      <div class="score" id="score-giuli">0</div>
      <button class="minus" id="minus-giuli" aria-label="Restar punto a Giuli">−</button>
    </div>

    <button class="reset" id="reset" aria-label="Reiniciar puntos">↺</button>

    <div class="zone zone--mati" id="zone-mati">
      <div class="name">Mati</div>
      <div class="score" id="score-mati">0</div>
      <div class="hint">Tocá para sumar</div>
      <button class="minus" id="minus-mati" aria-label="Restar punto a Mati">−</button>
    </div>

    <script>
      const state = {
        mati: parseInt(localStorage.getItem('puntos-mati') || '0', 10),
        giuli: parseInt(localStorage.getItem('puntos-giuli') || '0', 10),
      }

      const els = {
        mati: document.getElementById('score-mati'),
        giuli: document.getElementById('score-giuli'),
      }

      function render() {
        els.mati.textContent = state.mati
        els.giuli.textContent = state.giuli
      }

      function save() {
        localStorage.setItem('puntos-mati', state.mati)
        localStorage.setItem('puntos-giuli', state.giuli)
      }

      function vibrate() {
        if (navigator.vibrate) navigator.vibrate(15)
      }

      function popText(zone, x, y, text) {
        const pop = document.createElement('div')
        pop.className = 'pop'
        pop.textContent = text
        pop.style.left = x - 20 + 'px'
        pop.style.top = y - 20 + 'px'
        zone.appendChild(pop)
        setTimeout(() => pop.remove(), 600)
      }

      function add(player, delta, zone, x, y) {
        state[player] = Math.max(0, state[player] + delta)
        render()
        save()
        vibrate()
        popText(zone, x, y, delta > 0 ? '+1' : '−1')
      }

      function bindZone(id, player) {
        const zone = document.getElementById(id)
        zone.addEventListener(
          'pointerup',
          (e) => {
            if (e.target.closest('.minus')) return
            add(player, 1, zone, e.clientX, e.clientY)
          },
          { passive: true },
        )
      }

      bindZone('zone-mati', 'mati')
      bindZone('zone-giuli', 'giuli')

      document.getElementById('minus-mati').addEventListener('pointerup', (e) => {
        e.stopPropagation()
        const zone = document.getElementById('zone-mati')
        add('mati', -1, zone, e.clientX, e.clientY)
      })

      document.getElementById('minus-giuli').addEventListener('pointerup', (e) => {
        e.stopPropagation()
        const zone = document.getElementById('zone-giuli')
        add('giuli', -1, zone, e.clientX, e.clientY)
      })

      document.getElementById('reset').addEventListener('pointerup', (e) => {
        e.stopPropagation()
        if (confirm('¿Reiniciar el marcador a 0-0?')) {
          state.mati = 0
          state.giuli = 0
          render()
          save()
        }
      })

      render()
    </script>
  </body>
</html>
